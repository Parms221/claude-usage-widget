# Escaneos de seguridad: cada lunes, al tocar dependencias y a mano.
#
# Este repo es público, así que CodeQL entra gratis (en repos privados de
# cuenta personal requiere GitHub Advanced Security).

name: Security

on:
  schedule:
    - cron: '17 9 * * 1' # lunes 09:17 UTC = 04:17 en Lima
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - go.mod
      - go.sum
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerabilidades Go (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A mano en vez de la action oficial: hay que analizar con GOOS=windows
      # (los paquetes win32 llevan //go:build windows y en Linux quedarían
      # fuera del análisis).
      - name: Instalar govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (GOOS=windows)
        env:
          GOOS: windows
        run: govulncheck ./...

  gitleaks:
    name: Secretos filtrados (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo, no sólo el último commit
          persist-credentials: false

      # Gratis para cuentas personales (GITLEAKS_LICENSE es sólo para orgs).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (Go)
    runs-on: windows-latest # el código sólo compila en Windows
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # subir los resultados a la pestaña Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          build-mode: autobuild

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
